name: Build NxNative iOS IPA (RAR + Older Device Support)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "NxNative repo URL (4ppp44/nxnative-ios17 for older A15/A16/non-BC iPhones, or seedds/nxnative for A17 Pro+)"
        required: true
        default: "https://github.com"
        type: string
      branch:
        description: "Branch name (leave empty for default branch)"
        required: false
        default: ""
        type: string
      separate_romfs:
        description: "Split RomFS into a separate file (recommended for large games / AltStore)"
        required: false
        default: true
        type: boolean
      extra_flags:
        description: "Additional flags for build_ipa_from_nsp.py"
        required: false
        default: ""
        type: string

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check available disk space
        run: df -h

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_27.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d "/Applications/Xcode-27.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode-27.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Clone NxNative Repository
        run: |
          CLEAN_URL=$(printf '%s' "${{ inputs.repo_url }}" | tr -d '\r\n ')
          CLEAN_BRANCH=$(printf '%s' "${{ inputs.branch }}" | tr -d '\r\n ')
          BRANCH_FLAG=""
          if [ -n "$CLEAN_BRANCH" ]; then
            BRANCH_FLAG="-b $CLEAN_BRANCH"
          fi
          git clone --depth 1 $BRANCH_FLAG "$CLEAN_URL" nxnative

      - name: Install Homebrew & Python dependencies
        run: |
          brew install xcodegen zstd glslang unar
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" gdown

      - name: Download and Extract Game Files (.rar / .zip / .7z)
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
        run: |
          mkdir -p game_files keys
          gdown --fuzzy "$KEYS_URL" -O keys/prod.keys

          cd game_files
          gdown --fuzzy "$GAME_URL"
          [ -n "$UPDATE_URL" ] && gdown --fuzzy "$UPDATE_URL"
          [ -n "$DLC_URL" ] && gdown --fuzzy "$DLC_URL"

          # Extract any .rar, .zip, or .7z archives and delete them immediately to save disk space
          for f in *.rar *.zip *.7z; do
            if [ -f "$f" ]; then
              unar -f "$f" && rm "$f"
            fi
          done

          # Move extracted .nsp/.xci/.nsz/.xcz files out of nested subfolders into game_files/
          find . -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" \) -exec mv {} . \;

      - name: Build iOS IPA
        run: |
          ROMFS_FLAG=""
          if [ "${{ inputs.separate_romfs }}" == "true" ]; then
            ROMFS_FLAG="--romfs separate"
          fi

          python3 nxnative/scripts/build_ipa_from_nsp.py game_files \
            -k keys/prod.keys \
            $ROMFS_FLAG \
            ${{ inputs.extra_flags }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-iOS-Build
          path: |
            game_files/*.ipa
            game_files/*.img
          if-no-files-found: error
