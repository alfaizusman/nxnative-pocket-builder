name: Build NxNative iOS IPA (Single IPA + RAR Support)

on:
  workflow_dispatch:
    inputs:
      extra_flags:
        description: "Additional flags for build_ipa_from_nsp.py"
        required: false
        default: ""
        type: string

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check available disk space
        run: df -h

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_27.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d "/Applications/Xcode-27.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode-27.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Clone NxNative Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo clone 4ppp44/nxnative-ios17 nxnative -- --depth 1

      - name: Install Homebrew & Python dependencies
        run: |
          brew install xcodegen zstd glslang unar
          python3 -m pip install --break-system-packages --ignore-installed lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'" gdown

      - name: Download and Extract Game Files (.rar / .zip / .7z)
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
          KEYS_URL: ${{ secrets.KEYS_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
        run: |
          mkdir -p game_files keys
          gdown --fuzzy "$KEYS_URL" -O keys/prod.keys

          cd game_files
          gdown --fuzzy "$GAME_URL"
          [ -n "$UPDATE_URL" ] && gdown --fuzzy "$UPDATE_URL"
          [ -n "$DLC_URL" ] && gdown --fuzzy "$DLC_URL"

          for f in *.rar *.zip *.7z; do
            if [ -f "$f" ]; then
              unar -f "$f" && rm "$f"
            fi
          done

          find . -mindepth 2 -type f \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" -o -iname "*.xcz" \) -exec mv {} . \;

      - name: Build iOS IPA
        run: |
          python3 nxnative/scripts/build_ipa_from_nsp.py game_files \
            -k keys/prod.keys \
            ${{ inputs.extra_flags }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-iOS-Build
          path: game_files/*.ipa
          if-no-files-found: error
