name: A Short Hike - IPA (No-BC)

on:
  workflow_dispatch:
    inputs:
      prod_keys_drive_link:
        description: "Google Drive share link for prod.keys (Anyone with the link)"
        required: true
      base_drive_link:
        description: "Google Drive share link for Base file (Anyone with the link)"
        required: true
      update_drive_link:
        description: "Google Drive share link for Update file (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out NXNative No-BC
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          path: nxnative

      - name: Install build dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew update
          brew install python@3.12 xcodegen zstd glslang
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python3.12 -m venv "$RUNNER_TEMP/nx-venv"
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown

      - name: Download prod.keys and game files from Google Drive
        env:
          KEYS_LINK: ${{ inputs.prod_keys_drive_link }}
          BASE_LINK: ${{ inputs.base_drive_link }}
          UPDATE_LINK: ${{ inputs.update_drive_link }}
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/ashorthike"
          mkdir -p "$GAME_DIR"

          echo "Downloading prod.keys..."
          "$RUNNER_TEMP/nx-venv/bin/gdown" --fuzzy "$KEYS_LINK" -O "$RUNNER_TEMP/prod.keys"
          test -s "$RUNNER_TEMP/prod.keys" || { echo "Downloaded prod.keys is empty"; exit 1; }

          cd "$GAME_DIR"
          echo "Downloading base game..."
          "$RUNNER_TEMP/nx-venv/bin/gdown" --fuzzy "$BASE_LINK"

          if [ -n "$UPDATE_LINK" ]; then
            echo "Downloading update..."
            "$RUNNER_TEMP/nx-venv/bin/gdown" --fuzzy "$UPDATE_LINK"
          fi

          ls -lh "$GAME_DIR"

      - name: Build unsigned A Short Hike IPA
        working-directory: nxnative
        env:
          DM_NO_BC_ASTC: all
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nx-venv/bin/python" scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/ashorthike" \
            -k "$RUNNER_TEMP/prod.keys" \
            --allow-other-metal \
            -o "$RUNNER_TEMP/A-Short-Hike.ipa"

          ls -lh "$RUNNER_TEMP/A-Short-Hike.ipa"

      - name: Upload A Short Hike IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-Short-Hike-IPA
          path: ${{ runner.temp }}/A-Short-Hike.ipa
          retention-days: 7

      - name: Remove temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.keys"
