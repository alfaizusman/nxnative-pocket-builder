
name: A Short Hike - IPA (No-BC)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out NXNative No-BC
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          path: nxnative

      - name: Check available disk space
        run: df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew update
          brew install python@3.12 xcodegen zstd glslang unar
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/nx-venv"
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install \
            lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown

      - name: Download A Short Hike archives and keys
        env:
          BASE_URL: ${{ secrets.SHORT_HIKE_BASE_NSP_URL }}
          UPDATE_URL: ${{ secrets.SHORT_HIKE_UPDATE_NSP_URL }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/short-hike"
          ARCHIVE_DIR="$RUNNER_TEMP/short-hike-archives"
          mkdir -p "$GAME_DIR" "$ARCHIVE_DIR"

          test -n "$BASE_URL" || {
            echo "Missing SHORT_HIKE_BASE_NSP_URL secret"
            exit 1
          }

          test -n "$PROD_KEYS" || {
            echo "Missing PROD_KEYS secret"
            exit 1
          }

          GDOWN="$RUNNER_TEMP/nx-venv/bin/gdown"

          "$GDOWN" "$BASE_URL" -O "$ARCHIVE_DIR/base.rar"

          if [ -n "$UPDATE_URL" ]; then
            "$GDOWN" "$UPDATE_URL" -O "$ARCHIVE_DIR/update.rar"
          fi

          echo "=== Downloaded archives ==="
          ls -lh "$ARCHIVE_DIR"

          for archive in "$ARCHIVE_DIR"/*.rar; do
            [ -f "$archive" ] || continue
            echo "Extracting $archive"
            unar -f -o "$GAME_DIR" "$archive"
          done

          echo "=== Extracted files ==="
          find "$GAME_DIR" -type f -print

          echo "=== Locating NSP files ==="
          find "$GAME_DIR" -type f -iname '*.nsp' -print

          NSP_COUNT="$(find "$GAME_DIR" -type f -iname '*.nsp' | wc -l | tr -d ' ')"

          echo "NSP files found: $NSP_COUNT"

          test "$NSP_COUNT" -ge 1 || {
            echo "No NSP files found after RAR extraction."
            exit 1
          }

          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          test -s "$RUNNER_TEMP/prod.keys"

      - name: Diagnose extracted game files
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/short-hike" -type f -iname '*.nsp' \
            -exec file {} \;

      - name: Build unsigned A Short Hike IPA
        working-directory: nxnative
        env:
          DM_NO_BC_ASTC: all
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/nx-venv/bin/python" \
            scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/short-hike" \
            -k "$RUNNER_TEMP/prod.keys" \
            --allow-other-metal \
            -o "$RUNNER_TEMP/A-Short-Hike.ipa"

          test -s "$RUNNER_TEMP/A-Short-Hike.ipa"

      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-short-hike-no-bc-ipa
          path: |
            ${{ runner.temp }}/A-Short-Hike.ipa
            ${{ runner.temp }}/short-hike/**/*_build/logs/**
            ${{ runner.temp }}/short-hike/**/*_build/profile/**
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.keys"
