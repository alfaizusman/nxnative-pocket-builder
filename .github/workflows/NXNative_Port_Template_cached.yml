# Generic NXNative iOS port workflow, with caching for faster builds.
# Caches only tools and downloads. Game files, decompressed NSPs and prod.keys
# are never cached.
#
# Required repo secrets:
#   BASE_URL     Link to your base game file
#   PROD_KEYS    Full contents of your prod.keys, dumped from your own console
# Optional repo secret:
#   UPDATE_URL   Link to the game's update file, if you have one

name: NXNative iOS Port (generic, cached)

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: "Short name for your game (letters, numbers, dashes)"
        required: true
        default: "mygame"
      base_format:
        description: "Format of your base file"
        required: true
        type: choice
        options:
          - nsz
          - nsp
        default: "nsz"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out NXNative No-BC
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          path: nxnative

      - name: Check available disk space
        run: df -h /

      # Bump the "v1" in these keys to force a fresh cache.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            brew-v1-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew update
          brew install python@3.12 xcodegen zstd glslang
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-v1-${{ runner.os }}-py312-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            pip-v1-${{ runner.os }}-py312-

      - name: Install Python dependencies
        run: |
          python3.12 -m venv "$RUNNER_TEMP/nx-venv"
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nx-venv/bin/python" -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown

      # Optional: if NXNative writes a shader or build cache, cache it here.
      # Find the real path in the NXNative build script (scripts/build_ipa_from_nsp.py)
      # or its README, then uncomment and set it. Only cache shader or pipeline
      # caches that the build generates from the game, and keep them out of
      # any folder that contains your base file or keys.
      # - name: Cache NXNative build cache
      #   uses: actions/cache@v4
      #   with:
      #     path: nxnative/<real-cache-path>
      #     key: nx-cache-v1-${{ runner.os }}-${{ hashFiles('nxnative/**') }}
      #     restore-keys: |
      #       nx-cache-v1-${{ runner.os }}-

      - name: Download base, update and keys
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          BASE_FORMAT: ${{ inputs.base_format }}
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game"
          mkdir -p "$GAME_DIR"

          for name in BASE_URL PROD_KEYS; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

          "$RUNNER_TEMP/nx-venv/bin/gdown" "$BASE_URL" -O "$GAME_DIR/base.$BASE_FORMAT"

          if [ -n "${UPDATE_URL:-}" ]; then
            "$RUNNER_TEMP/nx-venv/bin/gdown" "$UPDATE_URL" -O "$GAME_DIR/update.nsp"
          else
            echo "No UPDATE_URL secret set, continuing with base only"
          fi

          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          ls -lh "$GAME_DIR"
          test -s "$GAME_DIR/base.$BASE_FORMAT"
          test -s "$RUNNER_TEMP/prod.keys"

      - name: Verify base file and keys
        env:
          BASE_FORMAT: ${{ inputs.base_format }}
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/game/base.$BASE_FORMAT"
          echo "File size: $(stat -c%s "$F" 2>/dev/null || stat -f%z "$F") bytes"
          echo "First 4 bytes:"
          head -c 4 "$F" | od -c
          echo "Lines with keys in prod.keys: $(grep -c '=' "$RUNNER_TEMP/prod.keys" || true)"
          grep -o '^[A-Za-z0-9_]*' "$RUNNER_TEMP/prod.keys" | sort -u || true

      - name: Prepare base as NSP
        env:
          BASE_FORMAT: ${{ inputs.base_format }}
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/game"
          OUT="$RUNNER_TEMP/game_nsp"
          mkdir -p "$OUT"

          if [ "$BASE_FORMAT" = "nsz" ]; then
            "$RUNNER_TEMP/nx-venv/bin/nsz" -D --keys "$RUNNER_TEMP/prod.keys" -o "$OUT" "$GAME_DIR/base.nsz"
          else
            cp "$GAME_DIR/base.nsp" "$OUT/base.nsp"
          fi

          if [ -f "$GAME_DIR/update.nsp" ]; then
            cp "$GAME_DIR/update.nsp" "$OUT/"
          fi

          ls -lh "$OUT"
          test -n "$(find "$OUT" -maxdepth 1 -iname '*.nsp' ! -iname '*update*' -print -quit)"

      - name: List base NSP contents
        run: |
          set -euo pipefail
          F="$(find "$RUNNER_TEMP/game_nsp" -maxdepth 1 -iname '*.nsp' ! -iname '*update*' | head -n1)"
          echo "Listing: $F"
          "$RUNNER_TEMP/nx-venv/bin/nsz" -L --keys "$RUNNER_TEMP/prod.keys" "$F"

      - name: Build unsigned IPA
        working-directory: nxnative
        env:
          DM_NO_BC_ASTC: all
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nx-venv/bin/python" scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game_nsp" -k "$RUNNER_TEMP/prod.keys" --allow-other-metal -o "$RUNNER_TEMP/${{ inputs.game_name }}.ipa"

      - name: Upload unsigned IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game_name }}-unsigned-ipa
          path: |
            ${{ runner.temp }}/${{ inputs.game_name }}.ipa
            ${{ runner.temp }}/game/*_build/logs/**
            ${{ runner.temp }}/game/*_build/profile/**
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.keys"
